[workspace]
resolver = "2"
members = [
  "contracts/*",
]
default-members = ["contracts/*"]

[workspace.package]
rust-version = "1.70"


[workspace.dependencies]
# Pin to soroban SDK version compatible with soroban-env-host
soroban-sdk = "=28.0.0-rc.1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = "fat"

# For more information about this profile see https://soroban.stellar.org/docs/basic-tutorials/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"


